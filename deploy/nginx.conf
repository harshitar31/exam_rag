# Load balancer in front of the app replicas.
#   - spreads requests over every "app" container (least busy first)
#   - caches GET pages (/papers, /facets) and DSpace PDFs
#   - rate-limits per IP, generously: campus Wi-Fi puts many students behind one IP

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    keepalive_timeout 30;
    gzip on;
    gzip_types application/json text/css application/javascript;

    log_format timed '$remote_addr "$request" $status $request_time $upstream_cache_status';
    access_log /var/log/nginx/access.log timed;

    # "app" resolves to every replica started with `docker compose up --scale app=N`
    upstream app {
        least_conn;
        server app:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=search:20m rate=30r/s;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=200m inactive=1h;
    proxy_cache_path /var/cache/nginx/pdfs  levels=1:2 keys_zone=pdfs:20m  max_size=5g   inactive=30d use_temp_path=off;

    server {
        listen 80;
        client_max_body_size 16k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        # replicas are on the same network: if a connection doesn't open in 2s the
        # replica is gone, so move on instead of waiting nginx's default 60s
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        location = /search {
            limit_req zone=search burst=60 nodelay;
            # /search is a read-only POST, so retrying it on another replica is
            # safe; nginx doesn't retry POSTs unless told to (non_idempotent)
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 3;
            proxy_pass http://app;
        }

        # Read-only GET endpoints: identical for everyone, safe to cache briefly
        location ~ ^/(papers|facets)$ {
            proxy_cache pages;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            add_header X-Cache $upstream_cache_status;
            proxy_pass http://app;
        }

        # Question papers never change once published: serve repeat downloads
        # from here instead of the library's DSpace server. Only active when
        # the app runs with PDF_BASE_URL=/dspace (agree this with the library).
        location /dspace/ {
            # resolve at request time, so nginx still starts where DSpace is unreachable
            resolver 127.0.0.11 valid=60s ipv6=off;
            set $dspace http://dspace.amritanet.edu:8080;
            rewrite ^/dspace/(.*)$ /$1 break;
            proxy_pass $dspace;
            proxy_set_header Host dspace.amritanet.edu:8080;
            proxy_cache pdfs;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache $upstream_cache_status;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
