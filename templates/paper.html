<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Question Paper - {{ subject }}</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        .paper-container {
            background-color: white;
            padding: 60px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
        }
        .header h1 {
            margin: 10px 0;
            font-size: 24px;
            text-transform: uppercase;
        }
        .header h2 {
            margin: 10px 0;
            font-size: 20px;
        }
        .instructions {
            margin: 30px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #333;
        }
        .question {
            margin: 25px 0;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .question:last-child {
            border-bottom: none;
        }
        .question-number {
            font-weight: bold;
            display: inline-block;
            min-width: 30px;
        }
        .marks {
            float: right;
            font-weight: bold;
            color: #666;
        }
        .question-text {
            margin-top: 10px;
            line-height: 1.8;
        }
        .actions {
            margin-top: 40px;
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid #333;
        }
        button {
            padding: 12px 30px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
        }
        button:hover {
            background-color: #555;
        }
        @media print {
            body {
                background-color: white;
            }
            .paper-container {
                box-shadow: none;
                padding: 0;
            }
            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="paper-container">
        <div class="header">
            <h1>Question Paper</h1>
            <h2>{{ subject }}</h2>
        </div>

        <div class="questions">
            {% for q in questions %}
            <div class="question">
                <div>
                    <span class="question-number">{{ q.number }}.</span>
                    {% if q.marks %}
                    <span class="marks">[{{ q.marks }} marks]</span>
                    {% endif %}
                </div>
                <div class="question-text">{{ q.question }}</div>
            </div>
            {% endfor %}
        </div>

        <div class="actions">
            <button onclick="window.print()">🖨️ Print Paper</button>
            <button onclick="window.close()">✕ Close</button>
        </div>
    </div>
</body>
</html>
