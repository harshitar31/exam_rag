<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Search</title>
<style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; color: #2c2c2c; margin:0; }
    header { background-color: #7b1113; color: white; padding: 25px; text-align: center; }
    main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    form { margin-bottom: 30px; }
    .search-row { display: flex; justify-content: center; gap: 10px; }
    input[type="text"] { padding: 12px; border-radius: 10px; border: 1px solid #ccc; flex: 1; max-width: 600px; }
    button { padding: 12px 20px; border: none; background: #4a0d0e; color: white; cursor: pointer; border-radius: 10px; transition: 0.2s; }
    button:hover { background: #2c0607; }

    .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
    .filters select, .filters input { padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; background: white; font: inherit; font-size: 0.9em; }
    .filters input[type="number"] { width: 90px; }
    .filters #course { width: 260px; }
    .filters .clear { background: none; color: #7b1113; padding: 8px 6px; }

    .status { text-align: center; color: #666; margin-bottom: 16px; }

    .results .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 18px;
        border-left: 5px solid #7b1113;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .card p { white-space: pre-line; }

    .card a { display: inline-block; margin-top: 8px; margin-right: 12px; color: #7b1113; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .asked { display: inline-block; margin-left: 8px; padding: 3px 9px; border-radius: 8px; background: #f3e5e5; color: #7b1113; font-size: 0.85em; font-weight: 600; }

    #loadMoreWrapper { text-align: center; margin-top: 20px; }

    /* ==== Difficulty badges ==== */
    .difficulty-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 0.85em;
        font-weight: 600;
        color: white;
        margin-left: 8px;
    }
    /* ==== Tabs ==== */
    .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .tab { background: transparent; border: 1px solid rgba(255,255,255,0.5); color: white; padding: 8px 16px; }
    .tab:hover { background: rgba(255,255,255,0.15); }
    .tab.active { background: white; color: #7b1113; font-weight: 600; }

    /* ==== Paper list ==== */
    .paper-list { list-style: none; padding: 0; margin: 12px 0 0; }
    .paper-list li { padding: 6px 0; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .paper-list .year { font-weight: 600; min-width: 3.5em; }
    .paper-list .exam { color: #555; flex: 1; }
    .paper-list a { margin-top: 0; }

    .easy { background-color: #4caf50; }      /* Green */
    .medium { background-color: #ff9800; }    /* Orange */
    .difficult { background-color: #f44336; } /* Red */
    .unknown { background-color: #9e9e9e; }   /* Gray */
</style>
</head>
<body>
<header>
    <h1>Past Papers</h1>
    <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="questionsTab" role="tab">Search questions</button>
        <button type="button" class="tab" data-tab="papersTab" role="tab">Find papers by course</button>
    </nav>
</header>

<main id="papersTab" hidden>
    <form id="papersForm">
        <div class="search-row">
            <input type="text" id="paperQuery" placeholder="Course code or name, e.g. 19CSE435 or computer vision" required>
            <button type="submit">Find</button>
        </div>
    </form>
    <div class="status" id="papersStatus"></div>
    <div class="results" id="papersResults"></div>
</main>

<main id="questionsTab">
    <form id="searchForm">
        <div class="search-row">
            <input type="text" id="query" placeholder="Type course name/topics..." required>
            <button type="submit">Search</button>
        </div>
        <div class="filters">
            <input id="course" list="courseList" placeholder="Any course">
            <datalist id="courseList"></datalist>
            <select id="year"><option value="">Any year</option></select>
            <select id="semester"><option value="">Any semester</option></select>
            <select id="difficulty">
                <option value="">Any difficulty</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="difficult">Difficult</option>
            </select>
            <input type="number" id="minMarks" min="0" placeholder="Min marks">
            <input type="number" id="maxMarks" min="0" placeholder="Max marks">
            <button type="button" class="clear" id="clearFilters">Clear</button>
        </div>
    </form>

    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
    <div id="loadMoreWrapper" style="display:none;">
        <button id="loadMore">Load More</button>
    </div>
</main>

<script>
let offset = 0;
let currentQuery = "";
let currentFilters = {};
const courseByLabel = {};

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
}

function safeUrl(url) {
    // http(s) links, or same-site paths like /dspace/... (PDF cache); never javascript: etc.
    return /^(https?:\/\/|\/(?!\/))/i.test(url || "") ? url : "#";
}

async function loadFacets() {
    const facets = await (await fetch("/facets")).json();
    const courseList = document.getElementById("courseList");
    for (const c of facets.courses) {
        const label = c.name ? `${c.code} - ${c.name}` : c.code;
        courseByLabel[label] = c.code;
        courseByLabel[c.code] = c.code;
        const opt = document.createElement("option");
        opt.value = label;
        courseList.appendChild(opt);
    }
    for (const y of facets.years) document.getElementById("year").add(new Option(y, y));
    for (const s of facets.semesters) document.getElementById("semester").add(new Option(`Semester ${s}`, s));
}

function readFilters() {
    const courseInput = document.getElementById("course").value.trim();
    return {
        course_code: courseByLabel[courseInput] || courseInput.split(" - ")[0] || "",
        year: document.getElementById("year").value,
        semester: document.getElementById("semester").value,
        difficulty: document.getElementById("difficulty").value,
        min_marks: document.getElementById("minMarks").value,
        max_marks: document.getElementById("maxMarks").value,
    };
}

async function runSearch(append) {
    const res = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: currentQuery, offset: offset, filters: currentFilters })
    });
    const data = await res.json();
    const results = data.results || [];

    const container = document.getElementById("results");
    if (append) container.insertAdjacentHTML("beforeend", renderResults(results));
    else container.innerHTML = renderResults(results);
    offset += results.length;

    document.getElementById("status").textContent =
        offset === 0 ? (data.error || "No matching questions. Try other words or fewer filters.") : "";
    document.getElementById("loadMoreWrapper").style.display = data.has_more ? "block" : "none";
}

document.getElementById("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    currentQuery = document.getElementById("query").value.trim();
    if (!currentQuery) return;
    currentFilters = readFilters();
    offset = 0;
    runSearch(false);
});

// Re-run the search as soon as a filter changes
document.querySelectorAll(".filters select, .filters input").forEach(el =>
    el.addEventListener("change", () => {
        if (currentQuery) document.getElementById("searchForm").requestSubmit();
    })
);

document.getElementById("clearFilters").addEventListener("click", () => {
    document.querySelectorAll(".filters select, .filters input").forEach(el => el.value = "");
    if (currentQuery) document.getElementById("searchForm").requestSubmit();
});

document.getElementById("loadMore").addEventListener("click", () => runSearch(true));

function renderResults(results) {
    return results.map(r => {
        const diff = escapeHtml((r.difficulty || "unknown").toLowerCase());
        const occurrences = r.occurrences || [{ year: r.year, file_link: r.file_link }];
        const years = [...new Set(occurrences.map(o => o.year).filter(Boolean))];
        const links = occurrences.map((o, i) =>
            `<a href="${escapeHtml(safeUrl(o.file_link))}" target="_blank" rel="noopener">📄 ${o.year ? escapeHtml(o.year) + " paper" : "View PDF" + (occurrences.length > 1 ? " " + (i + 1) : "")}</a>`
        ).join("");
        return `
        <div class="card">
            <b>${escapeHtml(r.course_code)} - ${escapeHtml(r.course_name)}</b>
            ${r.semester ? ` (Semester ${escapeHtml(r.semester)})` : ''}
            <span class="difficulty-badge ${diff}">${escapeHtml(r.difficulty_tag || diff)}</span>
            ${occurrences.length > 1 ? `<span class="asked">Asked ${occurrences.length}× ${years.length ? "(" + years.map(escapeHtml).join(", ") + ")" : ""}</span>` : ''}
            <p>${escapeHtml(r.question_text)}</p>
            ${links}<br>
            <small>Marks: ${escapeHtml(r.marks || '-')} | Similarity Score: ${Number(r.score).toFixed(2)}</small>
        </div>
        `;
    }).join("");
}

// ==== Tabs ====
document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    document.querySelectorAll("main").forEach(m => m.hidden = m.id !== tab.dataset.tab);
    try { localStorage.setItem("tab", tab.dataset.tab); } catch (e) {}
}));
try {
    const saved = localStorage.getItem("tab");
    if (saved) document.querySelector(`.tab[data-tab="${saved}"]`)?.click();
} catch (e) {}

// ==== Find papers by course ====
document.getElementById("papersForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = document.getElementById("paperQuery").value.trim();
    if (!q) return;
    const status = document.getElementById("papersStatus");
    status.textContent = "Searching…";
    const data = await (await fetch("/papers?q=" + encodeURIComponent(q))).json();
    const courses = data.courses || [];
    status.textContent = courses.length ? "" : "No course matches. Try the course code (e.g. 19CSE435) or fewer words.";
    document.getElementById("papersResults").innerHTML = courses.map(c => `
        <div class="card">
            <b>${escapeHtml(c.code)} - ${escapeHtml(c.name || "Unknown course name")}</b>
            <span class="asked">${c.papers.length} paper${c.papers.length === 1 ? "" : "s"}</span>
            <ul class="paper-list">
                ${c.papers.map(p => `
                <li>
                    <span class="year">${escapeHtml(p.year || "—")}</span>
                    <span class="exam">${escapeHtml(p.exam || "")}${p.semester ? " · Semester " + escapeHtml(p.semester) : ""}</span>
                    <a href="${escapeHtml(safeUrl(p.pdf_url))}" target="_blank" rel="noopener">📄 Open PDF</a>
                </li>`).join("")}
            </ul>
        </div>`).join("");
});

loadFacets();
</script>
</body>
</html>
